<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Nourish — a mindful nutrition tracker. High-fidelity mobile prototype." />
    <meta name="theme-color" content="#F3EFE6" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@400..700&display=swap"
    />
    <title>Nourish — Eat with intention</title>
    <script>
      // Apply the persisted theme before first paint to avoid a flash.
      try {
        var s = JSON.parse(localStorage.getItem('nourish.app') || '{}')
        if (s.state && s.state.theme) document.documentElement.dataset.theme = s.state.theme
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
